version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
