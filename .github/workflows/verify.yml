name: Verify PND Assist V5

on:
  push:
    branches: [main, pnd-v5]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build dashboard
        run: npm run build
      - name: Install bot dependencies
        run: npm ci --prefix bot
      - name: Run bot tests
        run: npm --prefix bot test
      - name: Validate Oracle bot archive
        run: python3 scripts/package-bot.py
      - name: Upload Oracle bot archive
        uses: actions/upload-artifact@v4
        with:
          name: pnd-assist-v5-oracle
          path: public/downloads/bot-oracle.zip
          if-no-files-found: error
          retention-days: 14
      - name: Lint changed bot security files
        run: npx eslint bot/index.js bot/guild-guard.js bot/guild-guard.test.js bot/dog-commands.js bot/dog-hierarchy-policy.js bot/dog-hierarchy-policy.test.js bot/moderation.js bot/moderation-policy.js bot/moderation-policy.test.js bot/moderation-protection-policy.js bot/moderation-protection-policy.test.js --rule "prettier/prettier: off"
      - name: Check bot JavaScript syntax
        run: node --check bot/index.js && node --check bot/guild-guard.js && node --check bot/dog-commands.js && node --check bot/dog-hierarchy-policy.js && node --check bot/dog-hierarchy-policy.test.js && node --check bot/voice-access-requests.js && node --check bot/voice-access-request-policy.js && node --check bot/voice-access-request-policy.test.js && node --check bot/moderation.js && node --check bot/moderation-policy.js && node --check bot/moderation-policy.test.js && node --check bot/moderation-protection-policy.js && node --check bot/moderation-protection-policy.test.js
