name: Regenerate patched dependency lockfile

on:
  push:
    branches:
      - security/patch-vite-zod-2026-11-26

permissions:
  contents: read

concurrency:
  group: fwu-lockfile-regeneration
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install from the generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fwu-patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
