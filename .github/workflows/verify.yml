name: Verify PND Assist V5

on:
  push:
    branches: [main, pnd-v5]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build dashboard
        run: npm run build
      - name: Install bot dependencies
        run: npm ci --prefix bot
      - name: Run bot tests
        run: npm --prefix bot test
      - name: Lint
        run: 'npx eslint . --rule "prettier/prettier: off"'
