name: Verify PND Assist V5

on:
  push:
    branches: [main, pnd-v5]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build dashboard
        run: npm run build
      - name: Install bot dependencies
        run: npm ci --prefix bot
      - name: Run bot tests
        run: npm --prefix bot test
      - name: Lint changed bot security files
        run: npx eslint bot/index.js bot/guild-guard.js bot/guild-guard.test.js --rule "prettier/prettier: off"
      - name: Check bot JavaScript syntax
        run: node --check bot/index.js && node --check bot/guild-guard.js && node --check bot/voice-access-requests.js && node --check bot/voice-access-request-policy.js
