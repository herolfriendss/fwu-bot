name: FWU quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot-tests:
    name: Bot tests (Node 24 + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fwu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fwu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHARED_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/fwu_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        run: npm ci --prefix bot

      - name: Run bot test suite
        run: npm --prefix bot test

      - name: Check bot command catalogue
        run: npm --prefix bot run audit:commands

      - name: Verify generated command audit is committed
        run: git diff --exit-code -- docs/architecture/PND_COMMAND_SURFACE_AUDIT.md

      - name: Check interaction reply safety
        run: npm --prefix bot run audit:replies

  dashboard-quality:
    name: Dashboard tests, types, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      # Some dashboard integration tests import pure bot modules that still
      # resolve the bot's runtime dependencies (for example discord.js).
      - name: Install bot dependencies for integration tests
        run: npm ci --prefix bot

      - name: Run dashboard tests
        run: npx vitest run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint changed application files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          if ((${#changed_files[@]})); then
            npx eslint --rule 'prettier/prettier: off' "${changed_files[@]}"
          else
            echo "No changed application files to lint."
          fi

      - name: Production build
        run: npm run build

  delivery-packages:
    name: Build and verify installable FWU packages
    runs-on: ubuntu-latest
    needs: [bot-tests, dashboard-quality, shell-and-packaging]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fwu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fwu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHARED_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/fwu_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm ci --prefix bot

      - name: Build verified FWU source archive
        run: python3 scripts/package-fwu-archive.py

      - name: Build independent bot packages
        run: python3 scripts/package-fwu-bots.py

      - name: Build complete installer bundle
        run: python3 scripts/package-fwu-installation.py

      - name: Verify delivery contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("livraison")
          dated = sorted(root.glob("FWU_2*.zip"))
          assert dated, "FWU source archive missing"
          required = ["GUARD", "FDPDLAVOC", "SUCK-ME", "LE-FISC", "INVEST-PLUS"]
          for name in required:
              path = root / "bots" / f"FWU-{name}.zip"
              assert path.is_file() and zipfile.ZipFile(path).testzip() is None, f"Invalid bot archive: {path}"
          bundle = zipfile.ZipFile(root / "FWU_INSTALLATION_COMPLETE.zip")
          assert bundle.testzip() is None, "Installer bundle is corrupt"
          names = set(bundle.namelist())
          for name in required:
              assert f"FWU-installation/FWU-{name}.zip" in names, f"Missing {name} in full installer"
          print("All five bot packages and the complete FWU installer are valid.")
          PY

      - name: Upload ready-to-install archives
        uses: actions/upload-artifact@v4
        with:
          name: FWU-INSTALLATION-${{ github.sha }}
          path: livraison/
          if-no-files-found: error
          retention-days: 14

  shell-and-packaging:
    name: Shell and packaging checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path '*/node_modules/*'
          )

      - name: Validate packaging scripts
        run: |
          python -m py_compile \
            scripts/package-fwu-archive.py \
            scripts/package-fwu-bots.py \
            scripts/package-fwu-installation.py
